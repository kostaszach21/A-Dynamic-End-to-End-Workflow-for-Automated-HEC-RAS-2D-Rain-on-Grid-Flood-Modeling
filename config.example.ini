# Copy this to config.ini and fill in the values for your model.
# config.ini is the only file you need to edit.
# Any value left blank must be passed on the command line instead.
# Paths may be absolute or relative to this file. Do not quote them.

[project]
# HEC-RAS project folder. The folder that contains the .prj file, not the file.
folder =

# Unsteady flow file to update, e.g. C:\model\basin.u01
unsteady_file =

# Plan file to update, e.g. C:\model\basin.p01
plan_file =

# Folder where HEC-RAS writes its stored maps (named after the plan).
results_folder =

# Full path to Ras.exe, or a version string such as 6.6
ras_executable =


[rainfall]
# Input NetCDF holding gridded precipitation.
netcdf =

# HEC-DSS file to write. A .window.json provenance file is written beside it.
dss =

# Does a timestamp mark the end or the start of its accumulation interval?
# auto reads it from the file metadata. end | begin | auto
interval_convention = auto

# REQUIRED. How the series stores depth.
# increments  each record is the depth that fell in its own interval
# cumulative  each record is the running total since the start
# There is no automatic choice, because a series that is constant in time
# is a uniform hyetograph and a stalled run-total at once, and no property
# of the data separates them. The converter checks this declaration against
# the series and refuses if they contradict each other.
accumulation =

# Drop the first record. Set to yes for a series made by differencing a
# cumulative field, where the first record is not a valid interval total.
drop_first_step = no


[grid]
# EPSG code to write the rainfall grid in. Must match the model terrain.
target_epsg =

# EPSG code the NetCDF coordinates are in. 4326 unless you know otherwise.
source_epsg = 4326

# Rainfall grid cell size in target CRS units. Use a value finer than the
# native cell size of your NetCDF.
cell_size_m = 1000

# Resampling method: nearest | linear | cubic | pchip | kriging
#   nearest  piecewise constant; conserves volume exactly, blocky
#   linear   bilinear on the lat/lon axes; the default
#   cubic    smooth, but can overshoot the source maximum
#   pchip    shape-preserving cubic, introduces no new extrema
#   kriging  ordinary kriging in the projected plane, with an exponential
#            variogram fitted to the event total. Distances are in metres, so
#            it is not distorted by the latitude/longitude anisotropy the
#            others inherit, and it is the only method here that accepts a
#            source which is not a regular grid. Measured on the WRF event it
#            conserves volume best (-0.02 %) and never exceeds the source
#            maximum, but it does not reconstruct the field as well as cubic
#            at any sampling density tested, on a lattice or scattered. Choose
#            it for those properties, or for input the other methods cannot
#            read at all - not for accuracy on a dense grid.
resample = linear


[terrain]
# DEM used as the hillshade backdrop on the maps. Optional.
dem =


[output]
# Folder for the PNG maps.
maps_folder =

# Figure resolution. 300 to 600 suits a journal figure.
dpi = 600

# Depth below which a cell is drawn as dry, in metres.
min_depth = 0.01
